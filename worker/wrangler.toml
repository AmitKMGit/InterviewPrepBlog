name = "personal-notebook-sync"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
GITHUB_OWNER = "REPLACE_WITH_GITHUB_USERNAME"
GITHUB_REPO = "InterviewPrepBlog"
SITE_ORIGIN = "https://REPLACE_WITH_GITHUB_USERNAME.github.io"
SITE_URL = "https://REPLACE_WITH_GITHUB_USERNAME.github.io/InterviewPrepBlog/"

[[kv_namespaces]]
binding = "NOTEBOOK_DATA"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["*/1 * * * *"]
